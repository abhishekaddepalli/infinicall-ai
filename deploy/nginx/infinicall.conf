# ==============================================================================
# InfiniCall AI Nginx Reverse Proxy Configuration
# Architecture: Single Domain (Unified Frontend + Backend + WebSockets)
# Domain Example: app.example.com
# ==============================================================================

# Map for WebSocket connection upgrades
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting zone for API protection
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com; # Replace with your production domain

    # ACME-challenge webroot for Certbot verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Client body limit for audio recordings and media uploads
    client_max_body_size 50M;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 1. BACKEND REST API
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 2. SOCKET.IO WEBSOCKETS (Real-time dashboard / live updates)
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 3. STATIC UPLOADS & EMBEDDABLE WIDGETS
    # --------------------------------------------------------------------------
    location /uploads/ {
        alias /www/apps/infinicall/autocall-api/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @backend_proxy;
    }

    location /widget/ {
        alias /www/apps/infinicall/autocall-api/public/widget/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @backend_proxy;
    }

    location @backend_proxy {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 4. ROOT & TELEPHONY VOICE STREAM WEBSOCKETS
    # When Twilio / Vobiz connects to wss://domain.com/?callId=... it connects to /
    # with Upgrade: websocket. Nginx routes WebSocket upgrades to backend :3100,
    # and all standard HTTP requests to Next.js frontend :3101.
    # --------------------------------------------------------------------------
    location / {
        if ($http_upgrade = "websocket") {
            proxy_pass http://127.0.0.1:3100;
        }

        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
